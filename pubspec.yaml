name: expense_tracker
description: "Personal Expense Tracker - Flutter, Riverpod, Sqflite (Clean Architecture)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0   # State management (3.x এর সর্বশেষ নেবে)
  sqflite: ^2.4.2            # Local SQLite database
  path: ^1.9.0               # Database path join
  intl: ^0.20.2              # Date & number format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
